<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Clean white circular disc with gold border -->
  <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" filter="url(#badgeShadow)"/>
  <!-- Official SLIATE Interlocking Diamonds -->
  <g fill="none" stroke="#28166F" stroke-width="2.6" stroke-linejoin="miter">
    <!-- Left Diamond -->
    <polygon points="26,12 38,26 26,40 14,26"/>
    <!-- Right Diamond -->
    <polygon points="38,12 50,26 38,40 26,26"/>
  </g>
  <!-- SLIATE Text -->
  <text x="32" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#28166F" letter-spacing="1">SLIATE</text>
</svg>
