<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0b1d3a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M 80 12 C 118 12, 138 24, 138 52 C 138 102, 102 136, 80 148 C 58 136, 22 102, 22 52 C 22 24, 42 12, 80 12 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        filter="url(#shadow)" />

  <!-- Inner Inset Shield -->
  <path d="M 80 20 C 112 20, 128 30, 128 54 C 128 96, 98 126, 80 136 C 62 126, 32 96, 32 54 C 32 30, 48 20, 80 20 Z" 
        fill="none" 
        stroke="rgba(255, 215, 0, 0.35)" 
        stroke-width="1.5" 
        stroke-dasharray="3,2" />

  <!-- Academic Mortarboard Cap -->
  <path d="M 80 34 L 114 48 L 80 62 L 46 48 Z" fill="url(#goldGrad)" />
  <path d="M 58 54 L 58 68 C 58 76, 102 76, 102 68 L 102 54 L 80 63 Z" fill="#e2e8f0" opacity="0.9" />
  <!-- Cap Tassel -->
  <path d="M 110 50 C 112 58, 115 64, 118 70" stroke="#f59e0b" stroke-width="2" fill="none" />
  <circle cx="118" cy="72" r="2.5" fill="#ffd700" />

  <!-- Open Academic Book -->
  <path d="M 80 82 C 72 78, 54 78, 44 82 L 44 104 C 54 100, 72 100, 80 104 Z" fill="#f8fafc" />
  <path d="M 80 82 C 88 78, 106 78, 116 82 L 116 104 C 106 100, 88 100, 80 104 Z" fill="#f1f5f9" />
  <line x1="80" y1="82" x2="80" y2="104" stroke="#64748b" stroke-width="1.5" />
  
  <!-- Book Page Lines -->
  <line x1="50" y1="88" x2="74" y2="88" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="50" y1="93" x2="74" y2="93" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="50" y1="98" x2="68" y2="98" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

  <line x1="86" y1="88" x2="110" y2="88" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="86" y1="93" x2="110" y2="93" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="86" y1="98" x2="104" y2="98" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

  <!-- Laurel Wreath Accents -->
  <path d="M 38 60 C 35 75, 42 98, 56 112" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M 122 60 C 125 75, 118 98, 104 112" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Laurel Leaves -->
  <circle cx="36" cy="70" r="2.5" fill="#ffd700" />
  <circle cx="39" cy="84" r="2.5" fill="#ffd700" />
  <circle cx="46" cy="98" r="2.5" fill="#ffd700" />
  
  <circle cx="124" cy="70" r="2.5" fill="#ffd700" />
  <circle cx="121" cy="84" r="2.5" fill="#ffd700" />
  <circle cx="114" cy="98" r="2.5" fill="#ffd700" />

  <!-- Text: ATI -->
  <text x="80" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="3">ATI • SLIATE</text>
</svg>
